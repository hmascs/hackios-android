org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true
kotlin.code.style=official

# minSdk 33 > targetSdk 28 is intentional (see docs/engineering-notes.md); silence the AGP warning
# so the build log stays readable and real warnings are not buried.
android.sync.suppressAgpWarnings=MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK
